<!DOCTYPE html>
<html lang="pt-BR">
    <link rel="manifest" href="manifest.json">
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação Veicular</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; font-size: 12pt; }
            .card-section { break-inside: avoid; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
            .img-preview-container { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
        }
        .img-preview {
            max-height: 120px;
            object-fit: cover;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <!-- Navbar / Cabeçalho -->
    <header class="bg-blue-800 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-car-wrench"></i>
                Sistema de Avaliação Veicular
            </h1>
            <nav class="flex gap-2">
                <button id="btnNavNovo" onclick="mostrarTela('form')" class="px-3 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Novo Relatório
                </button>
                <button id="btnNavLista" onclick="mostrarTela('lista')" class="px-3 py-2 bg-blue-900 hover:bg-blue-950 rounded text-sm font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-database"></i> Veículos Salvos
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TELA DE LISTAGEM DE VEÍCULOS SALVOS -->
        <section id="telaLista" class="hidden no-print">
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
                    <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open"></i> Registros de Veículos
                    </h2>
                    <div class="relative w-full md:w-64">
                        <input type="text" id="inputBusca" oninput="buscarVeiculos()" placeholder="Buscar por placa, modelo ou chassi..." class="w-full pl-9 pr-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b text-xs uppercase text-gray-600 font-semibold">
                                <th class="p-3">Data</th>
                                <th class="p-3">Placa</th>
                                <th class="p-3">Veículo</th>
                                <th class="p-3">Ano / Modelo</th>
                                <th class="p-3">KM Actual</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo" class="divide-y text-sm">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                    <div id="semRegistros" class="text-center py-8 text-gray-500 hidden">
                        Nenhum registro encontrado no banco de dados local.
                    </div>
                </div>
            </div>
        </section>

        <!-- TELA DO FORMULÁRIO E VISUALIZADOR DE IMPRESSÃO -->
        <section id="telaForm">
            <!-- Barra de Ações Rápidas do Formulário -->
            <div class="flex justify-between items-center mb-6 no-print">
                <h2 class="text-xl font-bold text-gray-800" id="formTitulo">
                    <i class="fa-solid fa-file-pen text-blue-700"></i> Avaliação do Veículo
                </h2>
                <div class="flex gap-2">
                    <button type="button" onclick="limparFormulario()" class="px-4 py-2 border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 rounded-md font-medium text-sm transition">
                        <i class="fa-solid fa-eraser"></i> Limpar
                    </button>
                    <button type="button" onclick="salvarRelatorio()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-medium text-sm transition flex items-center gap-1">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar no Banco
                    </button>
                    <button type="button" onclick="imprimirPDF()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-medium text-sm transition flex items-center gap-1">
                        <i class="fa-solid fa-file-pdf"></i> Imprimir / PDF
                    </button>
                </div>
            </div>

            <!-- Formulário Completo (também usado na renderização de Impressão) -->
            <form id="avaliacaoForm" class="space-y-6">
                <input type="hidden" id="registroId">

                <!-- 0. DADOS DO VEÍCULO -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-600 card-section">
                    <h3 class="text-lg font-bold text-blue-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-id-card"></i> DADOS DO VEÍCULO
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Veículo</label>
                            <input type="text" id="veiculo" required class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Ex: Gol 1.0">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ano / Modelo</label>
                            <input type="text" id="anoModelo" required class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Ex: 2018/2019">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Placa</label>
                            <input type="text" id="placa" required class="w-full p-2 border rounded text-sm uppercase focus:ring-1 focus:ring-blue-500 outline-none" placeholder="ABC-1234">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Chassi</label>
                            <input type="text" id="chassi" class="w-full p-2 border rounded text-sm uppercase focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Número do Chassi">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Renavam</label>
                            <input type="text" id="renavam" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Número do Renavam">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">KM Atual</label>
                            <input type="text" id="kmAtual" required class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Ex: 75.000 km">
                        </div>
                    </div>
                </div>

                <!-- 1. DOCUMENTAÇÃO -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-amber-500 card-section">
                    <h3 class="text-lg font-bold text-amber-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice"></i> DOCUMENTAÇÃO
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fotos / Documentos (CRLV, Débitos, Multas, etc.)</label>
                            <input type="file" accept="image/*" multiple onchange="carregarImagens(event, 'previewDocumentacao')" class="no-print block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                            <div id="previewDocumentacao" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 img-preview-container"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Observações sobre Documentação</label>
                            <textarea id="obsDocumentacao" rows="2" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-amber-500 outline-none" placeholder="Situação de IPVA, Licenciamento, Restrições, Multas, etc."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 2. PARTE EXTERNA -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500 card-section">
                    <h3 class="text-lg font-bold text-blue-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-car-side"></i> PARTE EXTERNA
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fotos da Parte Externa</label>
                            <input type="file" accept="image/*" multiple onchange="carregarImagens(event, 'previewExterna')" class="no-print block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <div id="previewExterna" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 img-preview-container"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Observações da Parte Externa</label>
                            <textarea id="obsExterna" rows="2" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Pintura, funilaria, vidros, faróis, alinhamento, riscos, amassados..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 3. MOTOR E TRANSMISSÃO -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-red-500 card-section">
                    <h3 class="text-lg font-bold text-red-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-gears"></i> MOTOR E TRANSMISSÃO
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fotos de Motor e Transmissão</label>
                            <input type="file" accept="image/*" multiple onchange="carregarImagens(event, 'previewMotor')" class="no-print block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                            <div id="previewMotor" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 img-preview-container"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Observações sobre Motor e Transmissão</label>
                            <textarea id="obsMotor" rows="2" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-red-500 outline-none" placeholder="Vazamentos, nível de óleo, fluído de freio/câmbio, ruídos, coxins, correias..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 4. SUSPENSÃO E PNEUS -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-emerald-500 card-section">
                    <h3 class="text-lg font-bold text-emerald-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <!-- Ícone Amortecedor + Roda/Pneu -->
                        <span class="inline-flex items-center gap-1.5 text-emerald-900">
                            <!-- SVG Amortecedor -->
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M11 2H13V4H11V2ZM10 5H14V7H10V5ZM11 8H13V10H11V8ZM9 11H15V13H9V11ZM11 14H13V16H11V14ZM9 17H15V19H9V17ZM11 20H13V22H11V20Z"/>
                            </svg>
                            <!-- SVG Roda com Pneu -->
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 4C16.42 4 20 7.58 20 12C20 16.42 16.42 20 12 20C7.58 20 4 16.42 4 12C4 7.58 7.58 4 12 4ZM12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7ZM12 9C13.66 9 15 10.34 15 12C15 13.66 13.66 15 12 15C10.34 15 9 13.66 9 12C9 10.34 10.34 9 12 9Z"/>
                            </svg>
                        </span>
                        SUSPENSÃO E PNEUS
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fotos da Suspensão e Pneus</label>
                            <input type="file" accept="image/*" multiple onchange="carregarImagens(event, 'previewSuspensao')" class="no-print block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                            <div id="previewSuspensao" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 img-preview-container"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Observações da Suspensão e Pneus</label>
                            <textarea id="obsSuspensao" rows="2" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-emerald-500 outline-none" placeholder="Estado dos pneus (TWI), buchas, amortecedores, pastilhas, discos, balanço..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 5. PARTE INTERNA -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500 card-section">
                    <h3 class="text-lg font-bold text-purple-900 border-b pb-2 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 fill-current text-purple-900 inline-block" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 2C5.9 2 5 2.9 5 4V13C5 14.1 5.9 15 7 15H17C18.1 15 19 14.1 19 13V8C19 6.9 18.1 6 17 6H15V4C15 2.9 14.1 2 13 2H7ZM7 4H13V6H7V4ZM4 16C2.9 16 2 16.9 2 18V20C2 21.1 2.9 22 4 22H20C21.1 22 22 21.1 22 20V18C22 16.9 21.1 16 20 16H4ZM5 18H19V20H5V18Z"/>
                        </svg>
                        PARTE INTERNA
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fotos da Parte Interna</label>
                            <input type="file" accept="image/*" multiple onchange="carregarImagens(event, 'previewInterna')" class="no-print block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                            <div id="previewInterna" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 img-preview-container"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Observações da Parte Interna</label>
                            <textarea id="obsInterna" rows="2" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-purple-500 outline-none" placeholder="Estofamento, painel, comandos elétricos, ar-condicionado, higienização..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Botões Inferiores -->
                <div class="flex justify-end gap-3 no-print pt-4">
                    <button type="button" onclick="salvarRelatorio()" class="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-md font-semibold shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Relatório
                    </button>
                    <button type="button" onclick="imprimirPDF()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Imprimir / PDF
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- BANCO DE DADOS LOCAL E LÓGICA DA APLICAÇÃO -->
    <script>
        // --- 1. CONFIGURAÇÃO BANCO DE DADOS (IndexedDB) ---
        let db;
        const request = indexedDB.open("AvaliacaoVeicularDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("veiculos")) {
                const store = db.createObjectStore("veiculos", { keyPath: "id", autoIncrement: true });
                store.createIndex("placa", "placa", { unique: false });
                store.createIndex("dataCriacao", "dataCriacao", { unique: false });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            carregarTabelaVeiculos();
        };

        request.onerror = function(e) {
            console.error("Erro ao abrir banco de dados local:", e);
        };

        // Objeto em memória para armazenar as imagens em Base64 por seção
        const fotosData = {
            previewDocumentacao: [],
            previewExterna: [],
            previewMotor: [],
            previewSuspensao: [],
            previewInterna: []
        };

        // --- 2. GERENCIAMENTO DE IMAGENS ---
        function carregarImagens(event, containerId) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    fotosData[containerId].push(base64Img);
                    renderizarImagens(containerId);
                };
                reader.readAsDataURL(file);
            });
            event.target.value = ""; // reseta o input
        }

        function renderizarImagens(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            fotosData[containerId].forEach((imgSrc, index) => {
                const div = document.createElement("div");
                div.className = "relative group border rounded p-1 bg-gray-50 flex items-center justify-center";
                div.innerHTML = `
                    <img src="${imgSrc}" class="img-preview w-full h-24 object-cover rounded">
                    <button type="button" onclick="removerImagem('${containerId}', ${index})" class="no-print absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 w-6 h-6 flex items-center justify-center text-xs opacity-80 hover:opacity-100 shadow" title="Remover">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function removerImagem(containerId, index) {
            fotosData[containerId].splice(index, 1);
            renderizarImagens(containerId);
        }

        // --- 3. OPERAÇÕES DE BANCO DE DADOS (CRUD) ---
        function salvarRelatorio() {
            const veiculoInput = document.getElementById("veiculo").value.trim();
            const placaInput = document.getElementById("placa").value.trim();

            if (!veiculoInput || !placaInput) {
                alert("Por favor, preencha pelo menos os campos Veículo e Placa!");
                return;
            }

            const idAtual = document.getElementById("registroId").value;
            const registro = {
                veiculo: veiculoInput,
                anoModelo: document.getElementById("anoModelo").value.trim(),
                placa: placaInput.toUpperCase(),
                chassi: document.getElementById("chassi").value.trim(),
                renavam: document.getElementById("renavam").value.trim(),
                kmAtual: document.getElementById("kmAtual").value.trim(),
                
                obsDocumentacao: document.getElementById("obsDocumentacao").value,
                obsExterna: document.getElementById("obsExterna").value,
                obsMotor: document.getElementById("obsMotor").value,
                obsSuspensao: document.getElementById("obsSuspensao").value,
                obsInterna: document.getElementById("obsInterna").value,

                fotos: JSON.parse(JSON.stringify(fotosData)),
                dataAtualizacao: new Date().toLocaleString("pt-BR")
            };

            const tx = db.transaction(["veiculos"], "readwrite");
            const store = tx.objectStore("veiculos");

            if (idAtual) {
                registro.id = parseInt(idAtual);
                registro.dataCriacao = document.getElementById("registroId").getAttribute("data-criacao");
                store.put(registro);
            } else {
                registro.dataCriacao = new Date().toLocaleString("pt-BR");
                store.add(registro);
            }

            tx.oncomplete = function() {
                alert("Relatório salvo com sucesso no banco de dados!");
                limparFormulario();
                carregarTabelaVeiculos();
                mostrarTela("lista");
            };
        }

        function carregarTabelaVeiculos(termoBusca = "") {
            if (!db) return;
            const tx = db.transaction(["veiculos"], "readonly");
            const store = tx.objectStore("veiculos");
            const request = store.getAll();

            request.onsuccess = function() {
                const lista = request.result;
                const tbody = document.getElementById("tabelaCorpo");
                const semRegistros = document.getElementById("semRegistros");
                tbody.innerHTML = "";

                const filtrados = lista.filter(v => {
                    const termo = termoBusca.toLowerCase();
                    return (
                        v.placa.toLowerCase().includes(termo) ||
                        v.veiculo.toLowerCase().includes(termo) ||
                        (v.chassi && v.chassi.toLowerCase().includes(termo))
                    );
                });

                if (filtrados.length === 0) {
                    semRegistros.classList.remove("hidden");
                } else {
                    semRegistros.classList.add("hidden");
                    filtrados.reverse().forEach(v => {
                        const tr = document.createElement("tr");
                        tr.className = "hover:bg-gray-50 border-b";
                        tr.innerHTML = `
                            <td class="p-3 font-medium text-gray-500">${v.dataCriacao || v.dataAtualizacao}</td>
                            <td class="p-3 font-bold text-blue-700">${v.placa}</td>
                            <td class="p-3">${v.veiculo}</td>
                            <td class="p-3">${v.anoModelo || '-'}</td>
                            <td class="p-3">${v.kmAtual || '-'}</td>
                            <td class="p-3 text-center flex justify-center gap-2">
                                <button onclick="editarRegistro(${v.id})" class="px-2 py-1 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded text-xs font-semibold" title="Abrir / Editar">
                                    <i class="fa-solid fa-folder-open"></i> Abrir
                                </button>
                                <button onclick="deletarRegistro(${v.id})" class="px-2 py-1 bg-red-100 text-red-700 hover:bg-red-200 rounded text-xs font-semibold" title="Excluir">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            };
        }

        function editarRegistro(id) {
            const tx = db.transaction(["veiculos"], "readonly");
            const store = tx.objectStore("veiculos");
            const request = store.get(id);

            request.onsuccess = function() {
                const v = request.result;
                if (!v) return;

                document.getElementById("registroId").value = v.id;
                document.getElementById("registroId").setAttribute("data-criacao", v.dataCriacao || "");
                
                document.getElementById("veiculo").value = v.veiculo || "";
                document.getElementById("anoModelo").value = v.anoModelo || "";
                document.getElementById("placa").value = v.placa || "";
                document.getElementById("chassi").value = v.chassi || "";
                document.getElementById("renavam").value = v.renavam || "";
                document.getElementById("kmAtual").value = v.kmAtual || "";

                document.getElementById("obsDocumentacao").value = v.obsDocumentacao || "";
                document.getElementById("obsExterna").value = v.obsExterna || "";
                document.getElementById("obsMotor").value = v.obsMotor || "";
                document.getElementById("obsSuspensao").value = v.obsSuspensao || "";
                document.getElementById("obsInterna").value = v.obsInterna || "";

                // Carrega Imagens
                Object.keys(fotosData).forEach(key => {
                    fotosData[key] = (v.fotos && v.fotos[key]) ? [...v.fotos[key]] : [];
                    renderizarImagens(key);
                });

                document.getElementById("formTitulo").innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-700"></i> Editando Veículo: ${v.placa}`;
                mostrarTela("form");
            };
        }

        function deletarRegistro(id) {
            if (confirm("Tem certeza que deseja excluir este registro de veículo?")) {
                const tx = db.transaction(["veiculos"], "readwrite");
                const store = tx.objectStore("veiculos");
                store.delete(id);
                tx.oncomplete = function() {
                    carregarTabelaVeiculos();
                };
            }
        }

        function buscarVeiculos() {
            const termo = document.getElementById("inputBusca").value;
            carregarTabelaVeiculos(termo);
        }

        // --- 4. CONTROLE DE INTERFACE E IMPRESSÃO ---
        function mostrarTela(tela) {
            const telaLista = document.getElementById("telaLista");
            const telaForm = document.getElementById("telaForm");
            
            if (tela === 'lista') {
                telaLista.classList.remove("hidden");
                telaForm.classList.add("hidden");
                carregarTabelaVeiculos();
            } else {
                telaLista.classList.add("hidden");
                telaForm.classList.remove("hidden");
            }
        }

        function limparFormulario() {
            document.getElementById("avaliacaoForm").reset();
            document.getElementById("registroId").value = "";
            document.getElementById("registroId").removeAttribute("data-criacao");
            document.getElementById("formTitulo").innerHTML = `<i class="fa-solid fa-file-pen text-blue-700"></i> Avaliação do Veículo`;

            Object.keys(fotosData).forEach(key => {
                fotosData[key] = [];
                renderizarImagens(key);
            });
        }

        function imprimirPDF() {
            window.print();
        }
    </script>
</body>
</html>
